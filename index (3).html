 `<p><button class="b" data-a="sb" data-id="${b.id||''}">Guardar</button> <button class="k" data-a="close">Cancelar</button>${b.id?` <button class="k r" data-a="db" data-id="${b.id}">Borrar</button>`:''}</p>`)}
function dayHtml(d){const l=S.bills.filter(b=>occ(b,d,d).length),x=S.tx.filter(t=>t.d===d&&!(t.bill&&l.some(b=>b.id===t.bill)));return `<div class="dp"><h3 style="text-transform:capitalize">${P(d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>`+(l.length?l.map(b=>{const dn=b.done&&b.done[d];return `<div class="row"><div><b>${esc(b.name)}</b><div class="mu">${eur(amtAt(b,d))} · ${esc(b.acc)}${b.auto?' · automática':''}${dn?' · ✓':''}</div></div><div>${dn?`<button class="k" data-a="undo" data-id="${b.id}" data-d="${d}">Deshacer</button>`:`<button class="b" data-a="pay" data-id="${b.id}" data-d="${d}">Pagada</button>`} <button class="k" data-a="eb" data-id="${b.id}">✎</button></div></div>`}).join(''):(x.length?'':'<p class="mu">No hay facturas ni movimientos este día.</p>'))+(x.length?'<b>Movimientos registrados</b>'+x.map(t=>`<div class="row" data-e="${t.id}" style="cursor:pointer"><div>${esc(t.pay||t.cat||'Sin concepto')}<div class="mu">${esc(t.cat)}</div></div><b class="${t.t==='i'?'g':'r'}">${t.t==='i'?'+':'−'}${eur(t.amt).replace('−','')}</b></div>`).join(''):'')+`<p><button class="b" data-a="nb" data-d="${d}">+ Factura</button> <button class="k" data-a="nt" data-d="${d}">+ Movimiento</button></p></div>`}

function cForm(c){c=c||{name:'',parent:''};dlg(`<h3>${c.name?'Editar':'Nueva'} categoría</h3>`+fl('Nombre',`<input id="f_m" value="${esc(c.name)}">`)+fl('Categoría padre (vacío = principal)',`<select id="f_p"><option value="">—</option>${S.cat.filter(x=>!x.parent&&x.name!==c.name).map(x=>`<option ${x.name===c.parent?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)+`<p><button class="b" data-a="sc" data-n="${esc(c.name)}">Guardar</button> <button class="k" data-a="close">Cancelar</button>${c.name?` <button class="k r" data-a="dc" data-n="${esc(c.name)}">Borrar</button>`:''}</p>`)}

function dlA(f,done){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);done()}
function dl(name,text,type,ok){const f=new File([text],name,{type}),done=()=>{if(ok)ok();toast('Archivo preparado. Comprueba que lo has guardado en Archivos.')};if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(done).catch(e=>{if(e&&e.name==='AbortError')toast('Cancelado: no se ha guardado.');else dlA(f,done)});return}dlA(f,done)}

 if(a==='eacc')aForm(S.acc.find(x=>x.id===id));if(a==='ecat')cForm(S.cat.find(x=>x.name===el.dataset.n));

 if(a==='undo'){const b=bl(),i=S.tx.findIndex(t=>t.bill===id&&t.d===dd);if(i>=0)S.tx.splice(i,1);b.done[dd]=2;save();render()}

 if(a==='dtx'){S.tx=S.tx.filter(t=>t.id!==id);save();close();render()}
 if(a==='sb'){const am=parseFloat($('#f_a').value);if(!g('m')||!(am>0)||!g('s')||!g('c')){toast('Faltan nombre, importe, cuenta o vencimiento.');return}
  const o={t:g('t'),name:g('m'),acc:g('c'),cat:g('g'),pay:g('p'),start:g('s'),rep:{k:g('k'),n:Math.max(1,+g('r')||1)},end:g('e'),auto:$('#f_u').checked,note:g('o')};
  if(id){const b=bl();if(am!==amtAt(b,today())){b.hist=(b.hist||[]).concat({from:($('#f_f')&&g('f'))||today(),amt:am})}Object.assign(b,o)}else S.bills.push(Object.assign({id:uid(),amt:am,done:{},hist:[]},o));save();run();close();render()}
 if(a==='db'){S.bills=S.bills.filter(b=>b.id!==id);save();close();render()}
 if(a==='sa'){const n=g('m');if(!n)return;const o={name:n,type:g('t'),open:parseFloat($('#f_o').value)||0};if(id){const c=S.acc.find(x=>x.id===id);if(c.name!==n)S.tx.forEach(t=>{if(t.acc===c.name)t.acc=n});Object.assign(c,o)}else S.acc.push(Object.assign({id:uid()},o));save();close();render()}
 if(a==='da'){S.acc=S.acc.filter(x=>x.id!==id);save();close();render()}
 if(a==='sc'){const n=g('m'),o=el.dataset.n;if(!n)return;if(o){const c=S.cat.find(x=>x.name===o);if(o!==n){S.tx.forEach(t=>{if(t.cat===o)t.cat=n});S.bills.forEach(b=>{if(b.cat===o)b.cat=n});S.cat.forEach(x=>{if(x.parent===o)x.parent=n})}c.name=n;c.parent=g('p')}else S.cat.push({name:n,parent:g('p')});save();close();render()}
 if(a==='dc'){const o=el.dataset.n;S.cat=S.cat.filter(x=>x.name!==o);S.cat.forEach(x=>{if(x.parent===o)x.parent=''});save();close();render()}
 if(a==='bk'){dl('copia-gastos-'+today()+'.json',JSON.stringify(Object.assign({},S,{bk:Date.now()})),'application/json',()=>{S.bk=Date.now();save();render()})}
 if(a==='csv')dl('movimientos-'+today()+'.csv','\uFEFFFecha;Tipo;Importe;Cuenta;Categoría;Beneficiario;Nota\n'+S.tx.map(t=>[t.d,t.t==='i'?'Ingreso':'Gasto',String(t.amt).replace('.',','),t.acc,t.cat,t.pay,t.note].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv');
